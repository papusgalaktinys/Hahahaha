name: Hourly PapusVPN Update 🌐

on:
  schedule:
    - cron: '0 * * * *' # Автозапуск каждый час автоматически
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Скачивание базы ключей
      - name: Download Keys Securely
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://githubusercontent.com"
          target: .
          filename: all_keys.txt

      - name: Filter and Beautify Keys
        run: |
          # 1. Отбираем первые 30 рабочих ключей
          grep -E '^(vless|ss)://' all_keys.txt | head -n 30 > filtered.txt

          # 2. Создаем красивую «шапку» с имитацией полосы лимита для красоты
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#📊 Трафик: [████████░░] 812 ГБ / 999 ГБ" > links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#⚡ Скорость: [10 Gbps] ────────────────" >> links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#⚙️ Тип подписки: Бессрочная [Premium]" >> links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#──────────────────────────────────────" >> links.txt

          # 3. Стираем старые названия и добавляем бренд PapusVPN с жестко прописанным пингом 80 ms
          sed 's/#.*//' filtered.txt | awk '{print $0 "#PapusVPN 🌐 Server [" NR "] 🟢 80 ms"}' >> links.txt

          # 4. Кодируем в Base64 для приложений
          cat links.txt | base64 -w 0 > sub.txt

          # Очистка
          rm all_keys.txt filtered.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "PapusVPN-Bot"
          git config --global user.email "bot@papusvpn.local"
          git add links.txt sub.txt
          git commit -m "PapusVPN: подписка переименована в приложении 🌐" || exit 0
          git push
          
