name: Hourly PapusVPN Update 🌐

on:
  schedule:
    - cron: '0 * * * *' # Автозапуск каждый час автоматически
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch from Telegram, Filter and Beautify Keys
        run: |
          # 1. Скачиваем свежие ключи из открытого Telegram-канала с VPN-конфигами через веб-панель
          curl -sL "https://t.me" > tg_page.txt
          curl -sL "https://t.me" >> tg_page.txt

          # 2. Вытаскиваем чистые ключи VLESS и Shadowsocks из текста страницы
          grep -oE '(vless|ss)://[^"<>]+' tg_page.txt | head -n 30 > filtered.txt

          # Если канал временно пуст, создаем один резервный сервер
          if [ ! -s filtered.txt ]; then
            echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none" > filtered.txt
          fi

          # 3. Создаем красивую «шапку» с имитацией полосы лимита для красоты
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#📊 Трафик: [████████░░] 812 ГБ / 999 ГБ" > links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#⚡ Скорость: [10 Gbps] ────────────────" >> links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#⚙️ Тип подписки: Бессрочная [Premium]" >> links.txt
          echo "vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&security=none#──────────────────────────────────────" >> links.txt

          # 4. Стираем старые названия и подписываем вашим брендом PapusVPN
          sed 's/#.*//' filtered.txt | awk '{print $0 "#PapusVPN 🌐 Server [" NR "]"}' >> links.txt

          # 5. Кодируем в Base64 для приложений
          cat links.txt | base64 -w 0 > sub.txt

          # Очистка
          rm tg_page.txt filtered.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "PapusVPN-Bot"
          git config --global user.email "bot@papusvpn.local"
          git add links.txt sub.txt
          git commit -m "PapusVPN: ключи успешно собраны из TG 🌐" || exit 0
          git push
          
