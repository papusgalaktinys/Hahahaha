name: Hourly PapusVPN Update 🌐

on:
  schedule:
    - cron: '0 * * * *' # Автозапуск каждый час
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Keys by Real Ping < 80ms
        run: |
          # 1. Скачиваем базу ключей
          curl -s "https://githubusercontent.com" > raw_vless.txt
          curl -s "https://githubusercontent.com" > raw_ss.txt
          cat raw_vless.txt raw_ss.txt > all_keys.txt

          # Создаем пустой файл для хороших ключей
          touch filtered.txt
          COUNT=0

          # 2. Перебираем ключи и замеряем реальный пинг
          while IFS= read -r line && [ $COUNT -lt 30 ]; do
            # Убираем пробелы
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue

            # Извлекаем IP-адрес или домен из ключа (между @ и :)
            if [[ "$line" =~ @([^:]+): ]]; then
              IP="${BASH_REMATCH[1]}"
              
              # Замеряем пинг (3 пакета, таймаут 1 сек)
              # Извлекаем среднее время ответа (avg)
              PING_RES=$(ping -c 3 -W 1 "$IP" 2>/dev/null | tail -1 | awk -F '/' '{print $5}' | cut -d. -f1)
              
              # Если сервер ответил и пинг строго меньше 80 мс
              if [ ! -z "$PING_RES" ] && [ "$PING_RES" -lt 80 ]; then
                echo "$line" >> filtered.txt
                COUNT=$((COUNT+1))
                echo "Сервер $IP подошел! Пинг: ${PING_RES}мс"
              fi
            fi
          done < all_keys.txt

          # Резервный план: если супер-быстрых серверов не нашлось, берем топ-20 обычных европейских
          if [ ! -s filtered.txt ]; then
            grep -E -i '(germany|\bde\b|finland|\bfi\b|netherlands|\bnl\b|russia|\bru\b)' all_keys.txt | head -n 20 > filtered.txt
          fi

          # 3. Брендируем под PapusVPN 🌐
          sed 's/#.*//' filtered.txt | awk '{print $0 "#PapusVPN 🌐 Ping < 80ms [" NR "]"}' > links.txt

          # 4. Кодируем в Base64 для приложения
          cat links.txt | base64 -w 0 > sub.txt

          # Удаляем временные файлы
          rm raw_vless.txt raw_ss.txt all_keys.txt filtered.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "PapusVPN-Bot"
          git config --global user.email "bot@papusvpn.local"
          git add links.txt sub.txt
          git commit -m "PapusVPN: отобраны сервера с реальным пингом < 80мс 🌐" || exit 0
          git push
          
